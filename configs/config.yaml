# One place for every path, date and threshold used by the code.

paths:
  raw: data/raw
  processed: data/processed

random_state: 42

# Stage 3: data preparation
daylight_irradiance_wm2: 50     # a 15-min bin counts as daylight from 50 W/m2 (EDA: 99 % of bins produce power)
min_daylight_coverage: 0.70     # drop an inverter with less than 70 % of its daylight bins present
irradiance_sensor_change: "2023-02-14"   # irradiance is rescaled from this day (EDA)

# Stage 11: chronological split (train <= train_end < val <= val_end < test)
split:
  train_end: "2022-06-30"
  val_end: "2022-12-31"
  test_end: "2023-12-31"

# Stage 11: unseen-inverter test (the six inverters that only start in 2023)
unseen_stations:
  - sq_block_p_inverter
  - shaw_auditorium_inverter
  - ug_hall8_inverter
  - ug_hall9_inverter
  - zone_a2_inverter_2
  - zone_a2_inverter_3
