# Single source of truth for paths, seeds, split dates and thresholds (§13.6).

paths:
  raw: data/raw
  processed: data/processed

random_state: 42
timezone: Asia/Hong_Kong

# Stage 3: data preparation
resample_freq: 15min
min_daylight_coverage: 0.70
daylight_irradiance_wm2: 50   # a bin counts as daylight for coverage if irradiance >= this

# Stage 4: A2 cleaning. B1 labels remain undefined below 100 W/m².
preprocessing:
  daylight_irradiance_wm2: 50

# Stage 11: chronological split
split:
  train_end: "2022-06-30"
  val_end: "2022-12-31"
  test_start: "2023-01-01"
  test_end: "2023-12-31"

# Stage 11: unseen-station holdout (the 6 inverters that start only in 2023)
unseen_stations:
  - sq_block_p_inverter
  - shaw_auditorium_inverter
  - ug_hall8_inverter
  - ug_hall9_inverter
  - zone_a2_inverter_2
  - zone_a2_inverter_3


